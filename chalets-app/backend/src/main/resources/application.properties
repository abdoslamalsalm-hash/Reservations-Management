# ===================================================================
# كل إعداد هنا يقرأ من متغيّر بيئة أولًا، وإلا يستخدم القيمة بعد النقطتين.
# الصيغة: ${اسم_المتغيّر:القيمة_الافتراضية_للتشغيل_المحلي}
#
# محليًا: ما تحتاج تضبط شيئًا — القيم الافتراضية تكفي.
# بعد النشر: تضبط المتغيّرات في لوحة Render ولا تلمس هذا الملف.
# ===================================================================

# ===== قاعدة البيانات =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chalets_db}
spring.datasource.username=${DB_USERNAME:slom}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update = ينشئ الجدول تلقائيًا أول مرة، ويحدّثه إذا تغيّر الـ Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# اطبع الـ SQL في الـ console (اجعلها false في النشر لتقليل السجلات)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===== الخادم =====
# Render يحدّد المنفذ عبر متغيّر PORT ولازم نستخدمه
server.port=${PORT:8080}

# اعرض رسائل الأخطاء في الـ response (مفيد وقت التطوير)
server.error.include-message=always

# ===== الحماية =====
# كلمة مرور الدخول المشتركة. غيّرها في Render عبر متغيّر APP_PASSWORD.
app.password=${APP_PASSWORD:local-dev}

# العناوين المسموح لها بالاتصال. بعد النشر ضع رابط Vercel هنا عبر CORS_ORIGIN.
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
